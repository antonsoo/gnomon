name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Node formats numbers and dates for the locale it starts in. Output that must not
      # change with the reader's locale is tested in one that writes 1.234,5.
      - name: Test again in a comma-decimal locale
        run: npm test
        env:
          LC_ALL: de_DE.UTF-8
          LANG: de_DE.UTF-8
      - run: npm run build
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
      - name: Check physical date curves in native SVG and PDF output
        run: |
          node studies/shadow-gaps/replay.mjs . "$RUNNER_TEMP/shadow-curves" after
          uv run --script studies/shadow-gaps/measure.py --capture "$RUNNER_TEMP/shadow-curves" --out "$RUNNER_TEMP/shadow-vectors.json" --expect after
      - name: Check both equatorial faces in native SVG and PDF output
        run: |
          node studies/equatorial-faces/replay.mjs . "$RUNNER_TEMP/equatorial-faces" after
          uv run --script studies/equatorial-faces/measure.py "$RUNNER_TEMP/equatorial-faces" "$RUNNER_TEMP/equatorial-measurements.json"
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
